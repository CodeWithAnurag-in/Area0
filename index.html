<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area0</title>
    <!-- Google Fonts: Plus Jakarta Sans (Headings) & Instrument Sans (All Body/UI/Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Synchronously enforce scroll to top (Hero Bitsphere) on every page reload -->
    <script>
      (function() {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // Before unload, reset scroll to (0,0) so the browser's session history snapshot is at the top
        window.addEventListener('beforeunload', function() {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
        });

        window.addEventListener('pagehide', function() {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
        });

        window.addEventListener('pageshow', function() {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
        });

        // Strip any URL hash on reload to prevent browser anchor auto-scrolling
        if (window.location.hash) {
          try {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          } catch (e) {}
        }
      })();
    </script>

    <!-- Theme initialization to prevent layout/color flash -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('bento-theme') || localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text-primary)] font-body antialiased overflow-x-hidden selection:bg-neutral-800 selection:text-white dark:selection:bg-white/20 dark:selection:text-white" style="font-family: var(--font-body), sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
